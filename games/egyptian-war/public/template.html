<section id="gameplay-view" class="card game-card shadow mx-auto d-none">
  <div class="card-body p-4 egyptian-war-game-panel">
    <h2 class="card-title text-center">Egyptian War</h2>
    <div class="egyptian-war-top-right">
      <div class="egyptian-war-host-controls d-none" id="egyptian-war-host-controls">
        <button id="egyptian-war-pause" class="btn btn-outline-light btn-sm"
          type="button" aria-pressed="false">Pause</button>
        <button id="egyptian-war-exit-game" class="btn btn-outline-danger btn-sm" type="button"
          data-bs-toggle="modal" data-bs-target="#exit-game-modal">Exit Game</button>
      </div>
      <p id="gameplay-connection-status"
        class="server-connection-status text-bg-warning egyptian-war-connection-status">
        Connecting to server…
      </p>
      <span id="network-ping" class="network-ping" aria-label="Current network ping"
        aria-live="polite">Ping: -- ms</span>
    </div>

    <aside id="egyptian-war-slap-rules" class="egyptian-war-slap-rules"
      aria-labelledby="egyptian-war-slap-rules-title">
      <div class="egyptian-war-slap-rules-heading">
        <h3 id="egyptian-war-slap-rules-title">Slap Rules</h3>
        <button id="toggle-slap-rules" class="btn btn-outline-light btn-sm"
          type="button" aria-expanded="true" aria-controls="egyptian-war-slap-rules-list">Hide</button>
      </div>
      <ul id="egyptian-war-slap-rules-list"></ul>
    </aside>

    <div class="egyptian-war-play-layout">
      <aside class="egyptian-war-side-panel" aria-label="Game communication">
        <div class="egyptian-war-side-panel-heading">
          <div class="egyptian-war-side-tabs" role="tablist" aria-label="Chat or spectators">
            <button id="show-game-chat" class="btn btn-sm btn-light" type="button" role="tab"
              aria-selected="true" aria-controls="egyptian-war-chat">Chat</button>
            <button id="show-game-spectators" class="btn btn-sm btn-outline-light" type="button" role="tab"
              aria-selected="false" aria-controls="egyptian-war-spectators">Spectators</button>
          </div>
          <button id="toggle-game-side-panel" class="btn btn-sm btn-outline-light egyptian-war-side-expand"
            type="button" aria-expanded="false" aria-label="Expand panel" title="Expand panel">
            <span aria-hidden="true"></span><span aria-hidden="true"></span>
          </button>
        </div>

        <section id="egyptian-war-chat" class="egyptian-war-chat" role="tabpanel"
          aria-labelledby="show-game-chat" hidden>
          <h3 id="egyptian-war-chat-title" class="visually-hidden">Game chat</h3>
          <ol id="egyptian-war-chat-messages" class="egyptian-war-chat-messages"
            aria-live="polite" aria-relevant="additions"></ol>
          <form id="egyptian-war-chat-form" class="egyptian-war-chat-form">
            <label class="visually-hidden" for="egyptian-war-chat-input">Message</label>
            <input id="egyptian-war-chat-input" class="form-control" type="text"
              maxlength="300" autocomplete="off" placeholder="Write a message">
            <button class="btn btn-outline-light" type="submit">Send</button>
          </form>
        </section>

        <section id="egyptian-war-spectators" class="egyptian-war-spectators" role="tabpanel"
          aria-labelledby="show-game-spectators" hidden>
          <h3 id="egyptian-war-spectators-title" class="visually-hidden">Spectators</h3>
          <ul id="egyptian-war-spectator-list" class="egyptian-war-spectator-list list-group"
            aria-live="polite"></ul>
        </section>
      </aside>

      <div class="egyptian-war-board-column">
        <div id="egyptian-war-arena" class="egyptian-war-arena">
          <div id="egyptian-war-animation-layer" class="egyptian-war-animation-layer"
            aria-hidden="true"></div>
          <div class="egyptian-war-felt">
            <div class="egyptian-war-table-info">
              <p id="egyptian-war-turn" class="egyptian-war-turn-inline" aria-live="polite"></p>
              <p class="egyptian-war-pile-label mb-2">
                Central pile: <span id="egyptian-war-pile-count">0 cards</span>
              </p>
              <div id="egyptian-war-pile-stack" class="egyptian-war-pile-stack"
                aria-label="Central card pile">
                <p id="egyptian-war-top-card" class="egyptian-war-empty-pile">No card played yet</p>
              </div>
              <p id="egyptian-war-challenge" class="egyptian-war-challenge mb-1"></p>
              <p id="egyptian-war-message" class="egyptian-war-message mb-0" aria-live="polite"></p>
            </div>
          </div>
          <div id="egyptian-war-players" class="egyptian-war-seats"
            aria-label="Players around the table"></div>
          <div id="egyptian-war-victory" class="egyptian-war-victory" role="status"
            aria-live="assertive" hidden></div>
        </div>

        <div class="egyptian-war-action-area">
          <div id="egyptian-war-turn-timer" class="egyptian-war-turn-timer mb-2 is-hidden"
            aria-hidden="true">
            <div class="progress flex-grow-1" role="progressbar" aria-label="Time remaining for this turn"
              aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div class="egyptian-war-timer-sleep-pattern" aria-hidden="true">
                <span class="egyptian-war-final-sleeper">
                  <span class="egyptian-war-sleeping-bear">&#x1F43B;</span>
                  <span class="egyptian-war-sleep-zs"><span>z</span><span>z</span><span>z</span><span>z</span></span>
                </span>
                <span class="egyptian-war-sleep-zs"><span>z</span><span>z</span><span>z</span></span>
                <span class="egyptian-war-sleep-zs"><span>z</span><span>z</span></span>
                <span class="egyptian-war-sleep-zs"><span>z</span></span>
                <span class="egyptian-war-sleep-spacer"></span>
              </div>
              <div id="egyptian-war-turn-timer-bar" class="progress-bar bg-warning" style="width: 100%"></div>
            </div>
            <span id="egyptian-war-turn-timer-value" class="egyptian-war-turn-timer-value">15s</span>
          </div>

          <div class="row g-2 egyptian-war-controls">
            <div class="col">
              <button id="egyptian-war-play-card" class="btn btn-success btn-lg w-100"
                type="button" disabled>Play a Card</button>
            </div>
            <div class="col">
              <button id="egyptian-war-slap" class="btn btn-warning btn-lg w-100" type="button" disabled>
                <span class="egyptian-war-action-label">Slap!</span>
                <span class="egyptian-war-action-subtitle">
                  <span class="egyptian-war-action-fire" aria-hidden="true">&#x1F525;</span>
                  Bring the pain
                  <span class="egyptian-war-action-fire" aria-hidden="true">&#x1F525;</span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
