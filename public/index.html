<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>
    <link
      rel="stylesheet"
      href="/vendor/bootstrap/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="/style.css">
  </head>

  <body>
    <main class="container py-5">
      <header class="text-center mb-5">
        <h1 class="display-3 fw-bold">GameHub</h1>

        <p
          id="connection-status"
          class="badge rounded-pill text-bg-warning"
        >
          Connecting to server…
        </p>
      </header>

      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <section class="card game-card h-100 shadow">
            <div class="card-body p-4">
              <h2 class="card-title">Host a game</h2>

              <button
                id="create-room"
                class="btn btn-primary btn-lg w-100 mb-3"
              >
                Create Room
              </button>

              <p
                id="created-room"
                class="room-code text-center fw-bold"
              ></p>

              <hr>

              <h3 class="h5">Players</h3>

              <ul
                id="player-list"
                class="list-group mb-4"
              ></ul>

              <h3 class="h5">Choose a game</h3>

              <select
                id="game-select"
                class="form-select form-select-lg mb-3"
              >
                <option value="">Loading games…</option>
              </select>

              <button
                id="start-game"
                class="btn btn-success btn-lg w-100"
                disabled
              >
                Start Game
              </button>

              <p
                id="game-status"
                class="status-message mt-3 mb-0"
              ></p>
            </div>
          </section>
        </div>

        <div class="col-12 col-lg-6">
          <section class="card game-card h-100 shadow">
            <div class="card-body p-4">
              <h2 class="card-title">Join a game</h2>

              <label for="room-code" class="form-label">
                Room code
              </label>

              <input
                id="room-code"
                class="form-control form-control-lg text-uppercase mb-3"
                type="text"
                placeholder="ABC123"
                maxlength="6"
                autocomplete="off"
              >

              <label for="player-name" class="form-label">
                Player name
              </label>

              <input
                id="player-name"
                class="form-control form-control-lg mb-3"
                type="text"
                placeholder="Your name"
                maxlength="20"
                autocomplete="nickname"
              >

              <button
                id="join-room"
                class="btn btn-warning btn-lg w-100"
              >
                Join Room
              </button>

              <p
                id="join-result"
                class="status-message mt-3 mb-0"
              ></p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
  </body>
</html>
