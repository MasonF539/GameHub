services:
  gamehub:
    build:
      context: .

    ports:
      # Windows port : container port
      # Change only the left number if port 3000 is already being used.
      - "3000:3000"

    environment:
      # The port used by GameHub inside the container.
      PORT: "3000"

      # "true" only when players reach GameHub through the Cloudflare tunnel
      # (the launcher's Public mode sets it). It makes rate limits use each
      # visitor's real address instead of the tunnel's. Never turn it on if
      # people you do not trust can reach port 3000 directly: they could forge
      # the address and dodge the limits.
      GAMEHUB_TRUST_CLOUDFLARE_IP: "${GAMEHUB_TRUST_CLOUDFLARE_IP:-false}"

      # The most rooms the server will hold at once.
      GAMEHUB_MAX_ROOMS: "${GAMEHUB_MAX_ROOMS:-200}"

    init: true

  tunnel:
    # Only starts when the "public" profile is requested.
    profiles:
      - public

    # Set CLOUDFLARED_VERSION to a release tag (for example in a .env file)
    # to pin the tunnel to a specific version instead of "latest".
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}

    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://gamehub:3000

    depends_on:
      - gamehub